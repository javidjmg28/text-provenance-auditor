[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-provenance-auditor"
version = "0.3.0"
description = "Provider-aware text and document provenance auditing without detector evasion"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Text Provenance Auditor contributors"}]
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.0",
  "PyMuPDF>=1.24.0",
  "c2pa-python>=0.37.0"
]

[project.optional-dependencies]
documents = [
  "python-docx>=1.1.0",
  "PyMuPDF>=1.24.0"
]
provenance = [
  "c2pa-python>=0.37.0"
]
web = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9"
]
dev = ["pytest>=8.0", "httpx>=0.27.0"]
all = [
  "python-docx>=1.1.0",
  "PyMuPDF>=1.24.0",
  "c2pa-python>=0.37.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "pytest>=8.0"
]

[project.scripts]
provenance-audit = "text_provenance_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
text_provenance_auditor = ["web_assets/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
